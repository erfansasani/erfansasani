  <text x="70" y="181" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="66" font-weight="700">Erfan Sasani</text>
  <text x="74" y="230" fill="#CBD5E1" font-family="Segoe UI,Arial,sans-serif" font-size="24">AI Developer · Software Builder · Automation</text>
  <text x="74" y="267" fill="#94A3B8" font-family="Segoe UI,Arial,sans-serif" font-size="16">Building useful products and exploring intelligent systems.</text>
  <circle cx="1000" cy="160" r="82" fill="none" stroke="#A855F7" stroke-opacity=".45"/>
